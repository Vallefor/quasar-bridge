name: release

on:
  push:
    tags: ['v*']
  # A manual run checks/builds the selected ref without publishing a release.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/ci.yml
    with:
      upload-speaker: true

  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: speaker-release
          path: dist
      - name: Upload, verify and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd dist
          for arch in arm64 armv7; do
            sha256sum --check "quasar-bridge-${RELEASE_TAG#v}-linux-$arch.tar.gz.sha256"
          done

          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft); then
            if [ "$draft" != true ]; then
              echo 'Release is already published; refusing to overwrite its assets.' >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "$RELEASE_TAG" --generate-notes
          fi
          # A failed upload leaves a draft that a rerun can complete.
          gh release upload "$RELEASE_TAG" ./*.tar.gz ./*.tar.gz.sha256 --clobber
          downloaded=$(mktemp -d)
          gh release download "$RELEASE_TAG" --dir "$downloaded" \
            --pattern '*.tar.gz' --pattern '*.tar.gz.sha256'
          for arch in arm64 armv7; do
            package="quasar-bridge-${RELEASE_TAG#v}-linux-$arch.tar.gz"
            cmp "$package" "$downloaded/$package"
            cmp "$package.sha256" "$downloaded/$package.sha256"
          done
          gh release edit "$RELEASE_TAG" --draft=false
          gh release view "$RELEASE_TAG" --json url --jq .url
